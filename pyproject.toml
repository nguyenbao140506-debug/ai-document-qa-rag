[build-system]
requires = ["setuptools>=84.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-document-qa-rag"
version = "1.0.0"
description = "Local PDF question answering with auditable evidence and reproducible retrieval evaluation"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
dependencies = [
  "numpy>=2.0,<3",
  "PyMuPDF==1.28.2",
  "faiss-cpu==1.16.0",
  "sentence-transformers==5.7.0",
  "transformers==5.24.0",
  "streamlit==1.67.0",
  "torch>=2.13,<3",
]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "pytest-cov==7.1.0", "ruff==0.17.6", "bandit==1.9.4", "pip-audit==2.10.1", "reportlab==4.5.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: uses downloaded embedding or generation model"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["ragqa"]
